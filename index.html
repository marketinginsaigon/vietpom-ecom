<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VietPOM - Danh Mục Sản Phẩm</title>
  <meta name="description" content="Chọn sản phẩm, tổng hợp đơn hàng và gửi về Google Sheet." />
  <link rel="stylesheet" href="style.css" />
  
  <style>
    /* ============================================================
       BỘ MÃ GIAO DIỆN CHUẨN UX/UI - VIETPOM BLUE MEDICAL
       ============================================================ */
    :root {
      --primary-color: #15558D !important;
      --primary-hover: #0F4373 !important;
      --red-alert: #E60000 !important;
    }

    /* 1. XÓA MẢNG SÁNG XANH LÁ Ở GÓC TRÁI */
    .hero-bg, .hero-bg-left, .hero-bg-right { 
        display: none !important; 
    }

    /* 2. CỨU NÉT NÚT "ĐIỀN THÔNG TIN MUA HÀNG" */
    .btn-outline {
        background-color: transparent !important; 
        color: var(--primary-color) !important; 
        border: 2px solid var(--primary-color) !important; 
        font-weight: bold !important;
    }
    .btn-outline:hover {
        background-color: var(--primary-color) !important; 
        color: #ffffff !important; 
    }

    /* 3. NÚT BẤM & TAG: Xanh Dương, chữ Trắng */
    .btn-primary, .btn-green, .btn-dark, .cart-pill, .label-pill, .add-btn, .checkout-btn, .order-icon {
      background-color: var(--primary-color) !important;
      color: #ffffff !important;
      border: none !important;
    }
    .btn-primary:hover, .btn-green:hover, .add-btn:hover {
      background-color: var(--primary-hover) !important;
      box-shadow: 0 4px 12px rgba(21, 85, 141, 0.3) !important;
    }
    .btn-primary *, .add-btn *, .checkout-btn * { color: #ffffff !important; }

    /* 4. CHỮ TIÊU ĐIỂM: Xanh Dương */
    h1, h2, h3, h4, .price, .section-kicker, .buyer-kicker, .summary-kicker, .text-success, .text-green {
      color: var(--primary-color) !important;
    }

    /* 5. KHỐI NỀN LỚN (Bảng ưu đãi, Form) */
    .promo-box, .buyer-info {
      background: linear-gradient(135deg, #1A6BBA, #0F4373) !important;
      border: none !important;
    }
    .promo-box *, .buyer-info * { color: #ffffff !important; }
    
    .buyer-info .info-list > div, section[id="buyer"] div.info-list div {
      background-color: rgba(255, 255, 255, 0.1) !important; 
      border-color: rgba(255, 255, 255, 0.2) !important; 
    }

    /* 6. GIỎ HÀNG: Nền trắng xám, chữ đen */
    .summary-card, .cart-summary {
      background-color: #F8FAFC !important;
      border: 1px solid #E2E8F0 !important;
    }
    .summary-card *:not(.btn):not(.btn *), .cart-summary *:not(.btn):not(.btn *) { 
      color: #333333 !important; 
    }
    .summary-card h3, .summary-total strong { color: var(--primary-color) !important; }

    /* 7. THẺ SẢN PHẨM: Nền nhạt, Thẻ HD màu Đỏ */
    .product-card > div:first-child { background-color: #F0F6FA !important; }
    #productGrid span[class*="absolute"], #productGrid span[class*="text-green"], #productGrid span[class*="text-teal"] {
      color: var(--red-alert) !important;
      font-weight: 900 !important;
      background: rgba(255,255,255,0.9) !important;
      padding: 2px 6px !important;
      border-radius: 4px !important;
    }

    /* 8. TỐI ƯU MOBILE: 2 cột gọn gàng */
    @media (max-width: 768px) {
      #productGrid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
      .product-card { height: 100% !important; display: flex !important; flex-direction: column !important; padding: 8px !important; }
      .product-card img { height: 120px !important; object-fit: contain !important; width: 100% !important; transform: scale(1.1) !important;}
      .product-card > div:last-child { margin-top: auto !important; display: block !important; width: 100% !important; }
      .add-btn { width: 100% !important; margin-top: 10px !important; margin-left: 0 !important; justify-content: center !important; }
      .hero-grid { grid-template-columns: 1fr !important; }
      .site-header .container { justify-content: space-between !important; }
    }
  </style>
</head>
