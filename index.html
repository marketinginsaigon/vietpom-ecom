  <title>VietPOM - Danh Mục Sản Phẩm</title>

  <style>
    /* ============================================================
       BỘ MÃ CSS ĐỒNG BỘ THƯƠNG HIỆU VIETPOM
       ============================================================ */
    .hero-bg, .hero-bg-left, .hero-bg-right { display: none !important; }

    .btn-outline { background-color: transparent !important; color: #15558D !important; border: 2px solid #15558D !important; font-weight: bold !important; }
    .btn-outline:hover { background-color: #15558D !important; color: #ffffff !important; }
    .btn-primary, .btn-green, .btn-dark, .cart-pill, .label-pill, .add-btn, .checkout-btn, .order-icon { background-color: #15558D !important; color: #ffffff !important; border: none !important; }
    .btn-primary:hover, .add-btn:hover { background-color: #0F4373 !important; }
    .btn-primary *, .add-btn *, .checkout-btn * { color: #ffffff !important; }
    h1, h2, h3, h4, .price, .section-kicker, .buyer-kicker, .summary-kicker, .text-success, .text-green { color: #15558D !important; }
    .promo-box, .buyer-info { background: linear-gradient(135deg, #1A6BBA, #0F4373) !important; border: none !important; }
    .promo-box *, .buyer-info * { color: #ffffff !important; }
    .buyer-info .info-list > div, section[id="buyer"] div.info-list div { background-color: rgba(255, 255, 255, 0.1) !important; border-color: rgba(255, 255, 255, 0.2) !important; }
    .summary-card, .cart-summary { background-color: #F8FAFC !important; border: 1px solid #E2E8F0 !important; }
    .summary-card h3, .summary-total strong { color: #15558D !important; }
    
    *, *::before, *::after { box-sizing: border-box !important; }
    body { overflow-x: hidden !important; }

    /* ============================================================
       CẤU HÌNH LƯỚI 4 CỘT TRÊN DESKTOP - KHÓA CHỐNG TRÀN ẢNH TUYỆT ĐỐI
       ============================================================ */
    #productGrid {
      display: grid !important;
      grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
      gap: 20px !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }

    .product-card {
      display: flex !important;
      flex-direction: column !important;
      height: 100% !important;
      background: #fff !important;
      border: 1px solid #e2e8f0 !important;
      border-radius: 12px !important;
      padding: 16px !important;
      box-sizing: border-box !important;
      position: relative !important;
      overflow: hidden !important; /* Khóa chết không cho nội dung tràn ra ngoài phá lưới */
    }

    .product-card > a {
      display: flex !important;
      flex-direction: column !important;
      flex-grow: 1 !important;
      text-decoration: none !important;
      width: 100% !important;
    }

    /* KHÓA CỨNG KHUNG ẢNH TRÊN DESKTOP: Không cho ảnh phình to đè sang ô bên cạnh */
    .product-img-wrap {
      width: 100% !important;
      height: 160px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      margin-bottom: 12px !important;
      background-color: transparent !important;
      position: relative !important;
      overflow: hidden !important;
    }

    .product-card img {
      max-width: 100% !important;
      max-height: 140px !important;
      object-fit: contain !important; /* Ép ảnh thu nhỏ vừa vặn khung sườn */
      position: static !important;
      margin: 0 auto !important;
    }

    .product-meta {
      display: flex !important;
      justify-content: space-between !important;
      margin-bottom: 8px !important;
      font-size: 12px !important;
      color: #64748b !important;
    }

    .product-card h3 {
      font-size: 15px !important;
      line-height: 1.4 !important;
      color: #15558D !important;
      margin: 0 0 12px 0 !important;
      text-align: left !important;
      font-weight: bold !important;
    }

    .product-bottom {
      margin-top: auto !important; /* Đẩy giá và nút xuống đáy đều nhau */
      width: 100% !important;
    }

    .product-card .price {
      font-size: 16px !important;
      font-weight: bold !important;
      color: #E60000 !important;
      margin-bottom: 12px !important;
      text-align: left !important;
    }

    /* Định dạng nút bấm to rõ, chống click lệch tọa độ */
    .add-btn, .product-card button {
      width: 100% !important;
      height: 38px !important;
      font-size: 14px !important;
      font-weight: bold !important;
      border-radius: 6px !important;
      cursor: pointer !important;
      border: none !important;
    }

    .qty-control {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      width: 100% !important;
      height: 38px !important;
    }
    .qty-control button { width: 36px !important; height: 36px !important; }

    /* Triệt tiêu khoảng trống thừa của thẻ note cũ */
    .product-card .note, .product-card p[class*="note"], .product-card span[class*="note"], .price-label {
      display: none !important; height: 0 !important; margin: 0 !important; padding: 0 !important;
    }

    /* CSS Khối Đăng ký Đại lý mới dưới Banner */
    .banner-register-box {
      margin-top: 15px;
      padding: 15px;
      background: #F0F6FA;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      text-align: center;
      box-sizing: border-box !important;
      width: 100% !important;
    }
    .banner-register-box h4 { font-size: 15px !important; margin: 0 0 6px 0 !important; color: #15558D !important; font-weight: bold !important; }
    .banner-register-box p { font-size: 13px !important; color: #475569 !important; margin: 0 0 12px 0 !important; line-height: 1.4; }
    .btn-banner-reg {
      display: inline-flex !important; align-items: center; justify-content: center;
      width: 100% !important; height: 40px !important; background-color: #15558D !important;
      color: #ffffff !important; font-weight: bold !important; border-radius: 6px !important;
      text-decoration: none !important; font-size: 14px !important; transition: background 0.2s;
    }
    .btn-banner-reg:hover { background-color: #0F4373 !important; }

    /* ============================================================
       ĐẶC TRỊ GIAO DIỆN TRÊN MOBILE (GIỮ NGUYÊN 2 CỘT CHUẨN XẾP DỌC)
       ============================================================ */
    @media (max-width: 768px) {
      .banner-register-box { padding: 12px; margin-top: 12px; }
      .banner-register-box h4 { font-size: 14px !important; }
      .banner-register-box p { font-size: 12px !important; margin: 0 0 10px 0 !important; }
      .btn-banner-reg { height: 36px !important; font-size: 13px !important; }

        gap: 8px !important;
        padding: 8px !important;
      }

      .product-img-wrap { height: 100px !important; margin-bottom: 8px !important; }
      .product-card img { max-height: 90px !important; }
      
      .product-meta { font-size: 10px !important; margin-bottom: 4px !important; }
      
      .product-card h3 {
        font-size: 13px !important;
        line-height: 1.3 !important;
        margin: 0 0 6px 0 !important;
        height: 34px !important;
        display: -webkit-box !important;
        -webkit-line-clamp: 2 !important;
        -webkit-box-orient: vertical !important;
        overflow: hidden !important;
        white-space: normal
